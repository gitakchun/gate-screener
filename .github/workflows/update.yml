name: 데이터 갱신 및 배포

on:
  schedule:
    - cron: "*/10 * * * *"   # 10분마다 (GitHub 사정으로 실제로는 몇 분~수십 분 늦을 수 있음)
  push:
    branches: [main]
  workflow_dispatch:          # Actions 탭에서 수동 실행

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: 시간봉 수집 → site/data.json
        run: python build_data.py
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v5
