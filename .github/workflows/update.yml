name: 데이터 갱신 및 배포

on:
  schedule:
    - cron: "*/10 * * * *"   # 10분마다 (GitHub 사정으로 실제로는 몇 분~수십 분 늦을 수 있음)
  push:
    branches: [main]
  workflow_dispatch:          # Actions 탭에서 수동 실행

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: 시간봉 수집 → site/data.json
        run: python build_data.py
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  # 업로드와 배포를 다른 작업으로 나눠야 배포 단계가 방금 올린 파일을 안정적으로 찾음
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      # 예전 실행을 "Re-run" 하면 그때의 옛 코드가 배포되어 최신 화면을 덮어씀.
      # main의 최신 커밋이 아닐 때는 배포하지 않음.
      - name: 최신 커밋인지 확인
        id: latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          head=$(gh api "repos/${{ github.repository }}/commits/main" -q .sha)
          if [ "$head" = "${{ github.sha }}" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::warning::옛 커밋(${GITHUB_SHA::7})이라 배포하지 않음. 최신은 ${head::7}"
          fi
      - id: deploy
        if: steps.latest.outputs.ok == 'true'
        uses: actions/deploy-pages@v5
